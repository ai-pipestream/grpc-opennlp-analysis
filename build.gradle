plugins {
    id 'application'
    alias(libs.plugins.protobuf)
    alias(libs.plugins.graalvm.native)
}

description = 'gRPC NLP analysis service wrapping the experimental Apache OpenNLP 3.x preview'

repositories {
    mavenLocal()
    // The experimental OpenNLP 3.x preview (ai.pipestream:opennlp-*) is the only dependency
    // not on Maven Central. It resolves from Central's snapshot repository; the ai.pipestream
    // Forgejo registry stays as a fallback. Both are scoped to exactly the fork: without the
    // filter, every dependency in the build would be looked up there first.
    maven {
        url = 'https://central.sonatype.com/repository/maven-snapshots'
        content {
            includeModuleByRegex('ai\\.pipestream', 'opennlp(-.*)?')
        }
    }
    maven {
        url = 'https://git.rokkon.com/api/packages/ai-pipestream/maven'
        content {
            includeModuleByRegex('ai\\.pipestream', 'opennlp(-.*)?')
        }
    }
    mavenCentral()
}

dependencies {
    implementation libs.opennlp.api
    implementation libs.opennlp.runtime
    implementation libs.opennlp.tools
    implementation libs.opennlp.model.resolver
    implementation libs.opennlp.embeddings
    implementation libs.opennlp.dl
    // SentencePiece subword tokenizer (TOKENIZER_SENTENCEPIECE).
    implementation libs.opennlp.subword
    // Gazetteer implementations behind the geo annotators (bundled Natural
    // Earth data; no external files).
    implementation libs.opennlp.geo
    // WordNet lexicon + Morphy lemmatizer (the OPENNLP_WORDNET_DIR lemmatizer
    // backend).
    implementation libs.opennlp.wordnet

    implementation libs.grpc.api
    implementation libs.grpc.stub
    implementation libs.grpc.protobuf
    implementation libs.grpc.netty.shaded
    // Health status service and ProtoReflectionServiceV1.
    implementation libs.grpc.services
    implementation libs.protobuf.java
    implementation libs.slf4j.api
    // grpc codegen emits @javax.annotation.Generated.
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    // Deliberate: no-op logging backend, the native-image-safe choice (see version catalog).
    runtimeOnly libs.slf4j.nop

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation libs.grpc.inprocess
    testRuntimeOnly libs.junit.platform.launcher
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// JDK 25 is a hard requirement.
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ["-Xlint:deprecation"]
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
}

application {
    mainClass = 'ai.pipestream.opennlp.analysis.AnalysisServer'
}

// Bake the service version into a classpath resource for GetCapabilities.
processResources {
    filesMatching('service-version.properties') {
        expand('version': project.version)
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.35.1"
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.83.1'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

// Generated protobuf sources have no javadoc tags; keep doclint useful but quiet.
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

// GraalVM CE native image. Reachability metadata comes from the plugin's metadata
// repository (grpc-netty-shaded, protobuf-java, ...) plus the project's own
// src/main/resources/META-INF/native-image entries.
// slf4j-nop (not slf4j-simple) is deliberate: netty's build-time class init would
// otherwise capture a SimpleLogger instance into the image heap.
// Only nativeCompile requires GraalVM (a GraalVM JDK 25 toolchain, e.g.
// `sdk install java 25.1.3-graalce`); every other task runs on any JDK 25.
graalvmNative {
    binaries {
        main {
            // The service is an executable, not a shared library.
            sharedLibrary = false
            verbose = true
            buildArgs.addAll([
                    '--no-fallback',
                    '--report-unsupported-elements-at-runtime',
                    '-H:+ReportExceptionStackTraces',
                    // The shaded netty-tcnative classes call into JNI from their class
                    // initializers; on GraalVM CE 25.0.x (e.g. the community container
                    // image) build-time initialization aborts the image build. They are
                    // only touched for OpenSSL-backed SSL, which this service does not
                    // use, so run-time initialization is safe everywhere.
                    '--initialize-at-run-time=io.grpc.netty.shaded.io.netty.internal.tcnative',
                    '--initialize-at-run-time=io.grpc.netty.shaded.io.netty.handler.ssl',
            ])
        }
    }
}


tasks.register('bufLint', Exec) {
    group = 'verification'
    description = 'Run buf lint (STANDARD) on the analysis proto contract'
    workingDir = rootDir
    commandLine 'buf', 'lint'
    inputs.files(fileTree(rootDir) {
        include 'buf.yaml'
        include 'src/main/proto/**/*.proto'
        exclude '**/build/**'
    })
}

// Operator CLI for fetching optional analysis resources (Hunspell dictionaries,
// MeCab dictionaries, model files). Usage: ./gradlew downloadResource --args="list"
tasks.register('downloadResource', JavaExec) {
    group = 'application'
    description = 'Fetch an analysis resource: --args="list" | --args="install <name> [dir]" | --args="install <uri> <dir> [sha256]"'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.pipestream.opennlp.analysis.tools.ResourceDownloader'
}

// Publishing: the service jar + sources jar as ai.pipestream:grpc-opennlp-analysis.
// Snapshots go to the ai.pipestream Forgejo registry (self-hosted side) or to
// Central Snapshots (github.com side); releases would go through the Central
// Portal, which validates the license/developer/scm pom metadata stamped below.
apply plugin: 'maven-publish'
apply plugin: 'signing'

java {
    withSourcesJar()
}

publishing {
    repositories {
        // Credentials come from the environment; the repos stay registered
        // unconditionally so the task names are stable, and only the env-gated
        // CI workflows invoke them.
        maven {
            name = 'forgejo'
            url = uri('https://git.rokkon.com/api/packages/ai-pipestream/maven')
            credentials {
                username = providers.environmentVariable('FORGEJO_ACTOR').orElse('ci').get()
                password = providers.environmentVariable('FORGEJO_TOKEN').orNull
            }
        }
        maven {
            name = 'central'
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
            credentials {
                username = providers.environmentVariable('MAVEN_CENTRAL_USERNAME').orNull
                password = providers.environmentVariable('MAVEN_CENTRAL_PASSWORD').orNull
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'grpc-opennlp-analysis'
                description = providers.provider { project.description }
                url = 'https://github.com/ai-pipestream/grpc-opennlp-analysis'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                developers {
                    developer {
                        id = 'krickert'
                        email = 'krickert@pipestream.ai'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/ai-pipestream/grpc-opennlp-analysis.git'
                    developerConnection = 'scm:git:ssh://git@github.com/ai-pipestream/grpc-opennlp-analysis.git'
                    url = 'https://github.com/ai-pipestream/grpc-opennlp-analysis'
                }
            }
        }
    }
}

// Signing is required for Central Portal releases but not for snapshot repos;
// it activates only when a key is present, exactly like protomolt.
signing {
    def signingKey = System.getenv('GPG_PRIVATE_KEY')
    def signingPassword = System.getenv('GPG_PASSPHRASE')
    required { signingKey != null }
    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications
    }
}
