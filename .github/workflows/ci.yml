name: ci

# Builds and tests on every push to main and every pull request, and lints the
# proto contract with buf.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: buf lint
        uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          breaking: false
          push: false
          pr_comment: false

      - name: Build and test
        run: ./gradlew build --no-daemon
